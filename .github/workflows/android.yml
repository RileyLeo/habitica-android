name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ main, 'version/*', 'feature/*' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Generate configuration files
      env:
        HABITICA_PROPERTIES_B64: ${{ secrets.HABITICA_PROPERTIES_B64 }}
        HABITICA_RESOURCES_B64: ${{ secrets.HABITICA_RESOURCES_B64 }}
        GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      run: |
        printf '%s' "$HABITICA_PROPERTIES_B64" | base64 --decode > habitica.properties
        printf '%s' "$HABITICA_RESOURCES_B64" | base64 --decode > habitica.resources
        printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > Habitica/google-services.json
    - name: Make Gradle wrapper executable
      run: chmod +x gradlew
    - name: Build phone APK
      run: ./gradlew :Habitica:assembleProdDebug -PdisablePreDex "-Dorg.gradle.jvmargs=-Xmx2g"
    - name: Upload phone APK
      uses: actions/upload-artifact@v7
      with:
        name: habitica-selfhosted-debug
        path: Habitica/build/outputs/apk/prod/debug/Habitica-prod-debug.apk
        if-no-files-found: error

  unit-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - "common"
          - "Habitica"
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6
    - name: Prepare
      run: ./.github/prepare-workflow
    - name: Run with Gradle
      run: ./gradlew ${{ matrix.module }}:testProdDebugUnitTest

